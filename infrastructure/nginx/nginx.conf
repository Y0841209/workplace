# Production Nginx Configuration
# Place at: infrastructure/nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Brotli (requires nginx built with --with-http_brotli_module)
    # brotli on;
    # brotli_vary on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=qr_limit:10m rate=30r/s;

    # Upstreams
    upstream api_backend {
        server api:8080;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:80;
        keepalive 32;
    }

    # HTTP -> HTTPS Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Configuration (certificates from Let's Encrypt via certbot)
        ssl_certificate /etc/letsencrypt/live/booking.company.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/booking.company.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/booking.company.com/chain.pem;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # Content Security Policy - Adjust for Material UI
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com data:;
            img-src 'self' data: https:;
            connect-src 'self' https:;
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'self';
        " always;

        # General Rate Limit
        limit_req zone=general_limit burst=200 nodelay;

        # Frontend (SPA)
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # WebSocket support for HMR (not used in prod, but safe)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Pass through important headers
            proxy_pass_request_headers on;
        }

        # Auth endpoints - Stricter rate limit
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            # ... same proxy settings as above
        }

        # QR Check-in - Specific rate limit
        location ~ ^/api/v1/check-in/ {
            limit_req zone=qr_limit burst=10 nodelay;
            proxy_pass http://api_backend;
            # ... same proxy settings
        }

        # Health Checks (no rate limit, no auth)
        location /health {
            access_log off;
            proxy_pass http://api_backend/health;
        }

        location /health/live {
            access_log off;
            proxy_pass http://api_backend/health/live;
        }

        location /health/ready {
            access_log off;
            proxy_pass http://api_backend/health/ready;
        }

        # Static Assets (served by frontend nginx, but proxy for consistency)
        location /assets/ {
            proxy_pass http://frontend_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Hangfire Dashboard (Admin only - protected by API auth)
        location /hangfire/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend/hangfire/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenTelemetry Collector (if used)
        location /api/traces {
            proxy_pass http://otel-collector:4318/v1/traces;
            proxy_http_version 1.1;
            proxy_set_header Content-Type application/json;
        }

        location /api/metrics {
            proxy_pass http://otel-collector:4318/v1/metrics;
        }

        location /api/logs {
            proxy_pass http://otel-collector:4318/v1/logs;
        }
    }
}