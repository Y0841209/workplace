version: '3.8'

# Workplace Booking Platform - Production Docker Compose
# Usage: docker-compose -f infrastructure/docker/docker-compose.yml up -d
#        docker-compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.override.yml up -d (for development)

services:
  # ==========================================
  # DATABASE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
      - ./database/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking_user} -d ${POSTGRES_DB:-booking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - booking-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BACKEND API
  # ==========================================
  api:
    build:
      context: ../..
      dockerfile: src/backend/src/WorkplaceBooking.Api/Dockerfile
      target: runtime
    container_name: booking-api
    hostname: api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-booking};Username=${POSTGRES_USER:-booking_user};Password=${POSTGRES_PASSWORD};Include Error Detail=true"
      ConnectionStrings__Hangfire: "Host=postgres;Database=${POSTGRES_DB:-booking};Username=${POSTGRES_USER:-booking_user};Password=${POSTGRES_PASSWORD}"
      
      # Microsoft Entra ID
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__Domain: ${AZURE_AD_DOMAIN}
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID}
      AzureAd__ClientSecret: ${AZURE_AD_CLIENT_SECRET}
      AzureAd__CallbackPath: /signin-oidc
      AzureAd__SignedOutCallbackPath: /signout-oidc
      
      # Email (SMTP)
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME:-Workplace Booking}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      
      # Frontend URL (for CORS, email links)
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-https://booking.company.com}
      
      # OpenTelemetry
      Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      
      # Hangfire Dashboard Auth
      Hangfire__Dashboard__RequireHttps: ${HANGFIRE_DASHBOARD_HTTPS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booking-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    # Health check via nginx (api doesn't expose port directly)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # BACKGROUND WORKER (Hangfire)
  # ==========================================
  worker:
    build:
      context: ../..
      dockerfile: src/backend/src/WorkplaceBooking.Api/Dockerfile
      target: runtime
    container_name: booking-worker
    hostname: worker
    command: ["dotnet", "WorkplaceBooking.Api.dll", "--worker"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-booking};Username=${POSTGRES_USER:-booking_user};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Hangfire: "Host=postgres;Database=${POSTGRES_DB:-booking};Username=${POSTGRES_USER:-booking_user};Password=${POSTGRES_PASSWORD}"
      
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__Domain: ${AZURE_AD_DOMAIN}
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID}
      AzureAd__ClientSecret: ${AZURE_AD_CLIENT_SECRET}
      
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME:-Workplace Booking}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      
      Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booking-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # FRONTEND (Build Stage + Nginx Serve)
  # ==========================================
  frontend:
    build:
      context: ../..
      dockerfile: src/frontend/Dockerfile
      target: runtime
    container_name: booking-frontend
    hostname: frontend
    environment:
      # Runtime env vars injected via nginx config template
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Workplace Booking}
    networks:
      - booking-internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # NGINX REVERSE PROXY
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: booking-nginx
    hostname: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - api
    networks:
      - booking-internal
      - booking-external
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # CERTBOT (Let's Encrypt)
  # ==========================================
  certbot:
    image: certbot/certbot:v2.10
    container_name: booking-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --deploy-hook \"nginx -s reload\"; sleep 12h & wait $${!}; done'"
    networks:
      - booking-external
    restart: unless-stopped
    profiles:
      - production

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    driver: local
  frontend_static:
    driver: local

# ==========================================
# NETWORKS
# ==========================================
networks:
  booking-internal:
    driver: bridge
    internal: false
  booking-external:
    driver: bridge