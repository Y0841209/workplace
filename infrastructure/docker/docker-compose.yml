version: '3.8'

# Workplace Booking Platform - Docker Compose
# Usage: docker-compose -f infrastructure/docker/docker-compose.yml up -d
#        docker-compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.override.yml up -d (development)
#
# NOTE: this compose uses the HTTP dev nginx config (nginx.dev.conf) so the stack
# starts without TLS certificates. Production TLS is handled by nginx.conf +
# certbot (profile: production) or by the hosting platform's edge (e.g. Render).

services:
  # ==========================================
  # DATABASE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL scripts bootstrap the schema on first run (001 creates extensions + booking schema)
      - ../../database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking_user} -d ${POSTGRES_DB:-booking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - booking-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BACKEND API
  # ==========================================
  api:
    build:
      context: ../..
      dockerfile: backend/src/WorkplaceBooking.API/Dockerfile
      target: runtime
    container_name: booking-api
    hostname: api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-booking};Username=${POSTGRES_USER:-booking_user};Password=${POSTGRES_PASSWORD};Include Error Detail=true"

      # Microsoft Entra ID
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__Domain: ${AZURE_AD_DOMAIN}
      AzureAd__TenantId: ${AZURE_AD_TENANT_ID}
      AzureAd__ClientId: ${AZURE_AD_CLIENT_ID}
      AzureAd__ClientSecret: ${AZURE_AD_CLIENT_SECRET}

      # Email (SMTP)
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME:-Workplace Booking}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}

      # Frontend URL (for CORS, email links)
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost}

      # CORS origins
      AllowedOrigins__0: ${ALLOWED_ORIGINS_0:-http://localhost}
      AllowedOrigins__1: ${ALLOWED_ORIGINS_1:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booking-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # FRONTEND (Build Stage + Nginx Serve)
  # ==========================================
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: runtime
    container_name: booking-frontend
    hostname: frontend
    environment:
      # Runtime env vars injected via nginx config template
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Workplace Booking}
    networks:
      - booking-internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # NGINX REVERSE PROXY (HTTP dev config; no TLS required)
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: booking-nginx
    hostname: nginx
    ports:
      - "80:80"
    volumes:
      - ../../nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - booking-internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # CERTBOT (Let's Encrypt) - only for self-hosted production TLS
  # ==========================================
  certbot:
    image: certbot/certbot:v2.10
    container_name: booking-certbot
    profiles: ["production"]
    volumes:
      - ../../infrastructure/certbot/conf:/etc/letsencrypt
      - ../../infrastructure/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --deploy-hook \"nginx -s reload\"; sleep 12h & wait $${!}; done'"
    networks:
      - booking-internal
    restart: unless-stopped

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    driver: local

# ==========================================
# NETWORKS
# ==========================================
networks:
  booking-internal:
    driver: bridge
