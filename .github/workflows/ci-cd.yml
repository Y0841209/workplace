name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # BACKEND BUILD & TEST
  # ==========================================
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restore dependencies
        run: dotnet restore backend/WorkplaceBooking.sln

      - name: Build
        run: dotnet build backend/WorkplaceBooking.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test backend/WorkplaceBooking.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: backend
          fail_ci_if_error: false

  # ==========================================
  # FRONTEND BUILD
  # Disabled until the frontend scaffold is completed (missing pages/layouts,
  # @tanstack/react-query-devtools not declared). Re-enable by removing `if: false`.
  # ==========================================
  frontend-build:
    if: false
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ==========================================
  # SECURITY - SAST (CodeQL)
  # ==========================================
  security-sast:
    name: Security - SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,+security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ==========================================
  # SECURITY - SCA (Trivy / Dependabot)
  # ==========================================
  security-sca:
    name: Security - SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .NET Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive
        working-directory: backend

      - name: Run Trivy (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/src'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-*.sarif'

  # ==========================================
  # DOCKER BUILD (API image)
  # ==========================================
  docker-build:
    name: Docker Build & Push (API)
    runs-on: ubuntu-latest
    needs: [backend-build-test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/booking-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/src/WorkplaceBooking.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # DEPLOY RENDER (staging para pruebas)
  # Requiere secrets del repo:
  #   RENDER_DEPLOY_HOOK_URL -> Deploy Hook URL del Blueprint en Render
  #   RENDER_APP_URL          -> https://<service>.onrender.com
  # ==========================================
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Trigger Render Blueprint deploy
        run: |
          curl -sSf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || exit 1

      - name: Smoke test (health/live)
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${{ secrets.RENDER_APP_URL }}/health/live"; then
              echo "API healthy"
              exit 0
            fi
            echo "waiting for API... ($i/30)"
            sleep 10
          done
          echo "API did not become healthy in time" >&2
          exit 1
